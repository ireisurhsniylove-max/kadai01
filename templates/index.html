<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuneBoard</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#f4f6fb;
        }

        header{
            background:linear-gradient(135deg,#7b61ff,#4facfe);
            color:white;
            text-align:center;
            padding:30px;
        }

        .container{
            width:90%;
            max-width:900px;
            margin:20px auto;
        }

        .form-box{
            background:white;
            padding:20px;
            border-radius:15px;
            margin-bottom:20px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        input,
        select,
        textarea{
            width:100%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ddd;
            border-radius:8px;
        }

        button{
            background:#4facfe;
            color:white;
            border:none;
            padding:10px 18px;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#3697fa;
        }

        .post{
            background:white;
            padding:20px;
            margin-bottom:15px;
            border-radius:15px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        .music{
            display:inline-block;
            background:#ff4f9a;
            color:white;
