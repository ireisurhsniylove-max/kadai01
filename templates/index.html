<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TuneBoard - 音楽・ゲーム交流掲示板</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <h1>TuneBoard</h1>
    <p>音楽・ゲーム交流掲示板</p>
  </header>

  <main>
    <!-- カテゴリ絞り込み & 新規投稿ボタン -->
    <section>
      <div>
        <button type="button" data-filter="all">すべて</button>
        <button type="button" data-filter="音楽">音楽</button>
        <button type="button" data-filter="ゲーム">ゲーム</button>
      </div>
      <button type="button" id="openModalBtn">新規投稿</button>
    </section>

    <!-- 投稿一覧 -->
    <section id="postList">
      {% for message in messages %}
      <article data-category="{{ message.category }}">
        <div>
          <span>[{{ message.category }}]</span>
        </div>
        <h2>{{ message.title }}</h2>
        <p>{{ message.text }}</p>
        <p>投稿者：{{ message.name }}｜{{ message.posted_at }}</p>
      </article>
      {% else %}
      <p>まだ投稿はありません。</p>
      {% endfor %}
    </section>
  </main>

  <!-- 新規投稿フォーム -->
  <section id="postModal">
    <h2>新しい投稿を作成</h2>
    <form id="postForm" action="{{ url_for('post') }}" method="post">
      <div>
        <label for="name">投稿者名</label>
        <input type="text" id="name" name="name" placeholder="名無し">
      </div>

      <div>
        <label for="category">カテゴリ</label>
        <select id="category" name="category" required>
          <option value="音楽">音楽</option>
          <option value="ゲーム">ゲーム</option>
        </select>
      </div>

      <div>
        <label for="title">タイトル</label>
        <input type="text" id="title" name="title" required>
      </div>

      <div>
        <label for="message">本文</label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <div>
        <button type="button" id="closeModalBtn">キャンセル</button>
        <button type="submit">投稿する</button>
      </div>
    </form>
  </section>

  <script src="{{ url_for('javascript_files', filename='app.js') }}"></script>
</body>
</html>
